; =====================================================================
;  php/forja.ini · Directivas de TU entorno de desarrollo      [CE 2.f]
;  Se monta en /usr/local/etc/php/conf.d/zz-forja.ini
;  Tras modificarlo:  docker compose restart php
;
;  TODO: escribe AL MENOS 6 directivas, una por línea, cada una con un
;  comentario (;) que explique QUÉ hace y POR QUÉ la configuras así.
;  Obligatorias: display_errors, error_reporting, date.timezone,
;  short_open_tag y expose_php. La sexta la eliges tú.
;
;  Formato:   directiva = valor     ; explicación
; =====================================================================

; ==============================================================================
; Configuración personalizada del entorno de desarrollo - Forja de Héroes
; ==============================================================================

; 1. display_errors: Controla si los errores deben mostrarse en pantalla.
; En desarrollo se activa (On) para detectar y corregir fallos de inmediato.
display_errors = On

; 2. error_reporting: Define el nivel de notificación de errores.
; E_ALL (-1 o 32767) reporta todos los errores, advertencias y avisos posibles.
error_reporting = E_ALL

; 3. date.timezone: Define la zona horaria predeterminada para las funciones de fecha.
; Se establece 'Europe/Madrid' para sincronizar horas y registros con la hora local peninsular.
date.timezone = "Europe/Madrid"

; 4. short_open_tag: Permite o prohíbe el uso de la etiqueta de apertura corta <? en PHP.
; Se activa (On) para dar soporte al estándar moderno de plantillas donde se combina con <?=.
short_open_tag = On

; 5. expose_php: Expone que PHP está instalado en el servidor a través de las cabeceras HTTP.
; En producción se apaga (Off) por seguridad para no dar pistas a atacantes sobre versiones.
expose_php = Off

; 6. memory_limit (Libre): Limita la cantidad máxima de memoria que un script puede consumir.
; Se asigna 256M para evitar que scripts descontrolados agoten la memoria RAM del servidor.
memory_limit = 256M