version: "3.8"
services:
    web:
        image: nginx:alpine
        container_name: web
        ports:
            - "8080:80"
        volumes:
            - ./src:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
        networks:
            - app-network
    php:
        build:
            context: ./php
            dockerfile: Dockerfile
        container_name: php
        volumes:
                - ./src:/var/www/html
        depends_on:
            - db
        networks:
            - app-network
    db:
        image: mysql:8.0
        container_name: db
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: mi_base_datos
            MYSQL_USER: mi_usuario
            MYSQL_PASSWORD: mi_password
            MYSQL_ROOT_PASSWORD: root_password
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - app-network

volumes:
    db_data:
    
networks:
    app-network:
        driver: bridge